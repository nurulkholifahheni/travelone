# docker-compose.yml
version: '3.8'

services:
  # 1. Traefik API Gateway Service
  traefik:
    image: traefik:v2.10
    container_name: traefik
    command:
      # Enable the Docker provider so Traefik can find and configure services automatically.
      - --providers.docker=true
      # Watch for container changes.
      - --providers.docker.exposedbydefault=false
      # Entrypoint for web traffic.
      - --entrypoints.web.address=:80
    ports:
      # The main entry point for all client requests.
      - "80:80"
    volumes:
      # Access to the Docker socket to discover services.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always

  # 2. Go API Service
  go-auth-service:
    build: ./services/auth-go
    container_name: golang-auth-service
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-travelone}
    # Use labels to tell Traefik how to route requests to this service.
    labels:
      - "traefik.enable=true"
      # Route requests with the host example.com and path prefix /auth
      - "traefik.http.routers.go-auth.rule=Host(`localhost`) && PathPrefix(`/auth`)"
      # The port of the service inside its container.
      - "traefik.http.services.go-auth.loadbalancer.server.port=8080"
    depends_on:
      - db

  # 3. PostgreSQL Database Service
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-travelone}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./core/database/migrations:/docker-entrypoint-initdb.d
    container_name: postgres-db
    restart: always

volumes:
  postgres_data:
